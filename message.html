<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} · Assessment Portal</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <!-- One page for every message. The server fills in the {{...}} parts. -->
  <body class="center-page">
    <main class="card message-card">
      <p class="message-icon">{{ICON}}</p>
      <h1 class="signup-title">{{TITLE}}</h1>
      <p class="signup-subtitle">{{TEXT}}</p>

      <a class="btn btn-primary btn-full" href="{{LINK}}">{{BUTTON}}</a>
    </main>
  </body>
</html>
