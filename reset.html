<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Password · Assessment Portal</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body class="center-page">
    <main class="card signup-card">
      <img class="signup-logo" src="/images/logo.svg" alt="Assessment Portal" />

      <h1 class="signup-title">Choose a new password</h1>
      <p class="signup-subtitle">Type your new password twice.</p>

      <form action="/reset" method="POST">
        <!-- the server fills in the code from your email link -->
        <input type="hidden" name="code" value="{{CODE}}" />

        <label class="field">
          <span class="field-label">New password</span>
          <span class="password-box">
            <input class="input" type="password" name="password" placeholder="At least 6 characters" minlength="6" required autofocus />
            <button type="button" class="eye" aria-label="Show password"></button>
          </span>
        </label>

        <label class="field">
          <span class="field-label">Confirm new password</span>
          <span class="password-box">
            <input class="input" type="password" name="confirm" placeholder="Type it again" minlength="6" required />
            <button type="button" class="eye" aria-label="Show password"></button>
          </span>
        </label>

        <button class="btn btn-primary btn-full" type="submit">Save New Password</button>
      </form>

      <p class="footer-note">&copy; JAAA Company</p>
    </main>

    <!-- eye button on password boxes -->
    <script src="/js/password.js"></script>
  </body>
</html>
