<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Use a Code · Assessment Portal</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body class="center-page">
    <main class="card signup-card">
      <img class="signup-logo" src="/images/logo.svg" alt="Assessment Portal" />

      <h1 class="signup-title">Use a code from the teacher in charge</h1>
      <p class="signup-subtitle">Can't get emails? Ask the teacher in charge for a code, then choose your password here.</p>

      <form action="/code" method="POST">
        <label class="field">
          <span class="field-label">Email</span>
          <input class="input" type="email" name="email" placeholder="The email the teacher in charge added" required autofocus />
        </label>

        <label class="field">
          <span class="field-label">Code</span>
          <input class="input input-code" type="text" name="code" placeholder="e.g. K7QM-4XPA" maxlength="12" autocomplete="off" required />
        </label>

        <label class="field">
          <span class="field-label">Full name <span class="field-hint">(only if you never signed up)</span></span>
          <input class="input" type="text" name="name" placeholder="e.g. Ama Owusu" />
        </label>

        <label class="field">
          <span class="field-label">New password</span>
          <span class="password-box">
            <input class="input" type="password" name="password" placeholder="At least 6 characters" minlength="6" required />
            <button type="button" class="eye" aria-label="Show password"></button>
          </span>
        </label>

        <label class="field">
          <span class="field-label">Confirm new password</span>
          <span class="password-box">
            <input class="input" type="password" name="confirm" placeholder="Type it again" minlength="6" required />
            <button type="button" class="eye" aria-label="Show password"></button>
          </span>
        </label>

        <button class="btn btn-primary btn-full" type="submit">Save Password</button>
      </form>

      <p class="switch-link">Have your password? <a href="/">Sign in</a></p>

      <p class="footer-note">&copy; JAAA Company</p>
    </main>

    <!-- eye button on password boxes -->
    <script src="/js/password.js"></script>
  </body>
</html>
