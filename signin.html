<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In · Assessment Portal</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body class="center-page">
    <main class="card signup-card">
      <img class="signup-logo" src="/images/logo.svg" alt="Assessment Portal" />

      <h1 class="signup-title">Welcome back</h1>
      <p class="signup-subtitle">Sign in to record and view scores.</p>

      <form action="/signin" method="POST">
        <label class="field">
          <span class="field-label">Email</span>
          <input class="input" type="email" name="email" placeholder="name@gmail.com" required autofocus />
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <span class="password-box">
            <input class="input" type="password" name="password" placeholder="Your password" required />
            <button type="button" class="eye" aria-label="Show password"></button>
          </span>
        </label>

        <p class="forgot-link"><a href="/forgot">Forgot password?</a></p>

        <button class="btn btn-primary btn-full" type="submit">Sign In</button>
      </form>

      <p class="switch-link">New teacher? <a href="/signup">Create an account</a></p>
      <p class="switch-link">Got a code from the teacher in charge? <a href="/code">Use it here</a></p>

      <p class="footer-note">&copy; JAAA Company</p>
    </main>

    <!-- eye button on password boxes -->
    <script src="/js/password.js"></script>
  </body>
</html>
